<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to SARA City</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1209;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Playfair Display', serif;
  }
  .card {
    width: 700px;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    position: relative;
  }
  .image-wrapper img {
    width: 100%;
    display: block;
  }
  .golden-line {
    height: 3px;
    background: linear-gradient(90deg, transparent, #c9a84c, #f0d080, #c9a84c, transparent);
  }
  .info-bar {
    background: linear-gradient(135deg, #1c1408 0%, #2d1f0a 40%, #1c1408 100%);
    padding: 28px 40px 24px;
    border-top: 1px solid rgba(201,168,76,0.2);
  }
  .welcome-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .welcome-text {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 5px;
    color: #c9a84c;
    text-transform: uppercase;
    opacity: 0.8;
  }
  .ornament { color: #c9a84c; font-size: 18px; opacity: 0.5; }
  .city-name {
    font-family: 'Cinzel', serif;
    font-size: 32px;
    font-weight: 700;
    color: #f0d080;
    letter-spacing: 6px;
    text-align: center;
    text-shadow: 0 0 40px rgba(201,168,76,0.3);
    margin-bottom: 16px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.4));
  }
  .divider-line.right {
    background: linear-gradient(90deg, rgba(201,168,76,0.4), transparent);
  }
  .divider-diamond {
    width: 6px;
    height: 6px;
    background: #c9a84c;
    transform: rotate(45deg);
    opacity: 0.7;
  }
  .product-info {
    display: flex;
    justify-content: space-around;
    margin-bottom: 22px;
  }
  .info-item { text-align: center; }
  .info-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(201,168,76,0.5);
    text-transform: uppercase;
    font-family: 'Cinzel', serif;
    margin-bottom: 4px;
  }
  .info-value { font-size: 13px; color: #e8c86a; font-style: italic; }
  .cta-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid rgba(201,168,76,0.5);
    color: #c9a84c;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.4s ease;
  }
  .cta-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.15), transparent);
    transition: left 0.5s ease;
  }
  .cta-btn:hover {
    border-color: #c9a84c;
    color: #f0d080;
    box-shadow: 0 0 20px rgba(201,168,76,0.15), inset 0 0 20px rgba(201,168,76,0.05);
  }
  .cta-btn:hover::before { left: 100%; }
  .cta-btn:active { transform: scale(0.99); }
  @keyframes shimmer {
    0% { box-shadow: 0 0 0 rgba(201,168,76,0); }
    50% { box-shadow: 0 0 40px rgba(201,168,76,0.5); border-color: #f0d080; }
    100% { box-shadow: 0 0 0 rgba(201,168,76,0); }
  }
  .page-overlay {
    position: fixed;
    inset: 0;
    background: #1c1408;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .page-overlay.visible { opacity: 1; pointer-events: all; }
  .overlay-text {
    font-family: 'Cinzel', serif;
    color: #c9a84c;
    font-size: 18px;
    letter-spacing: 8px;
    opacity: 0;
    transition: opacity 0.4s ease 0.3s;
  }
  .page-overlay.visible .overlay-text { opacity: 1; }
</style>
</head>
